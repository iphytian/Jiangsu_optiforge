name: 提交公开通知
description: 提交项目启动、会议、评审、活动等可公开通知。Issue 内容公开可见。
title: "[公开通知] "
labels: ["notice", "submission"]
body:
  - type: markdown
    attributes:
      value: |
        > **这是公开 Issue。** 只提交可公开的通知。
        > 请不要填写个人姓名、手机号、邮箱、内部编号或其他不宜公开的信息。

  - type: input
    id: title
    attributes:
      label: 通知标题
      placeholder: 例如：G1 总体方案评审调整至 2027 年 2 月
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: 发布日期
      placeholder: "2026-11-11"
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 分类
      options:
        - 项目动态
        - 通知公告
        - 会议活动
        - 其他
    validations:
      required: true

  - type: input
    id: summary
    attributes:
      label: 一句话摘要
      description: 将显示在通知列表和 README 中，控制在 60 字以内。
    validations:
      required: true

  - type: textarea
    id: body
    attributes:
      label: 正文
      description: 使用 Markdown；只写可公开内容，不写个人姓名和联系方式。
      placeholder: 时间、地点、事项、对公众的影响...
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 公开确认
      options:
        - label: 我确认该通知可以公开，不含内部资料或个人身份信息。
          required: true
        - label: 我确认没有填写个人姓名、手机号、邮箱或不宜公开的编号。
          required: true
